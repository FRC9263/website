# Site-wide settings and the home page blocks.
# Edit the text here; run `python build.py` to rebuild.

name: ALD Lions
team_number: 9263
school: Aldershot School
city: Burlington, Ontario
email: frc9263@gmail.com

intro: >-
  A FIRST Robotics Competition team from Aldershot School in Burlington.
  Every season we design, build and program a competition robot,
  then take it to events across Ontario.

# Home page banner photo (file in static/img/) and its description for screen readers
hero_photo: team-photo.jpg
hero_alt: ALD Lions students and mentors together in the pits, wearing team shirts and safety glasses.

# Big numbers under the banner. Keep these to facts from FRC Events / The Blue Alliance.
stats:
  - { value: "2023", label: Rookie year }
  - { value: "4", label: Seasons competed }
  - { value: "1", label: Event win }
this_season: { year: "2027", game: BIOCORE }

# Short blocks near the bottom of the home page
blocks:
  - title: Aldershot School
    text: >-
      Our home school in Burlington, Ontario. Aldershot students who want
      to be part of the team can reach us through the Join page.
    link: { title: How to join, url: /join/ }
  - title: FIRST Robotics Competition
    text: >-
      An international high-school robotics program. Each January a new game is
      announced, and teams build a full-size robot to play it at events.
    link: { title: What FRC is, url: /about/#what-frc-is }

# Main menu (order = order on screen)
nav:
  - { title: About, url: /about/ }
  - { title: Team, url: /team/ }
  - { title: Sponsors, url: /sponsors/ }
  - { title: Join, url: /join/ }

# "Latest" block on the home page. Replaced by live data in build step 2.
latest:
  event: Overtime Sunday (off-season)
  date: November 1, 2026
  summary: >-
    Ranked 14th of 27 after qualifications with a 4–3 record,
    then led Alliance 8 into the playoffs.

# "Next up" block on the home page.
next:
  title: 2027 season — BIOCORE
  summary: >-
    The new game is revealed at kickoff in January.
    Our events will be listed here once the schedule is out.

# Season history, newest first. Only facts from FIRST / The Blue Alliance.
history:
  - year: 2026
    text: >-
      REBUILT season. Competed at the Waterloo and Niagara College district
      events and qualified for the FIRST Ontario Provincial Championship.
  - year: 2025
    text: >-
      REEFSCAPE season. Won the University of Waterloo District Event,
      our first event win and first blue banner.
  - year: 2024
    text: >-
      CRESCENDO season, our second year in the Ontario district.
  - year: 2023
    text: >-
      Rookie year. Earned the Rookie Inspiration Award at the
      FIRST Ontario Provincial Championship.

# News coverage. Newest first. Headline + link only; describe it in our own words.
press:
  - outlet: CTV News Kitchener
    date: March 23, 2025
    title: Waterloo and Breslau high schools beat multiple world records in FIRST Robotics Competition
    url: "https://www.ctvnews.ca/kitchener/article/waterloo-and-breslau-high-schools-beat-multiple-world-records-in-first-robotics-competition/"
    # Optional: the publisher's own embed player URL (the src="" part of their embed code)
    video: "https://embed.jasperplayer.com?brand=CTV_NEWS&destination=ctvnews_web&language=EN&contentId=3102934"
    summary: >-
      Covers the University of Waterloo District Event, where our alliance with
      CyberCavs 4678 and Team DAVE 3683 broke more than one world record.

links:
